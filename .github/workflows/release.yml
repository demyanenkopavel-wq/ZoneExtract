# Собирает ZoneExtract.exe для Windows и прикладывает к релизу.
# Запуск: отправьте тег вида v2.0.0  (git tag v2.0.0 && git push origin v2.0.0)
# или нажмите «Run workflow» на вкладке Actions (тогда exe будет в артефактах сборки).

name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed --name ZoneExtract zoneextract.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZoneExtract-windows
          path: dist/ZoneExtract.exe

      - name: Attach exe to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ZoneExtract.exe
          generate_release_notes: true
